<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Pass the Wolf: a wolf howling at the moon in the hex tray</title>
  <defs>
    <mask id="crescent">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="196" cy="136" r="62" fill="#000"/>
    </mask>
  </defs>
  <!-- The hex tray, a carved block with a cut ink rim -->
  <path d="M256 14 L466 135 L466 377 L256 498 L46 377 L46 135 Z" fill="#120c22"/>
  <path d="M256 40 L444 148 L444 364 L256 472 L68 364 L68 148 Z" fill="#4e3a86"/>
  <path d="M256 40 L444 148 L444 364 L256 472 L68 364 L68 148 Z" fill="none" stroke="#e9e4f7" stroke-width="12" stroke-linejoin="round"/>
  <!-- Gouge marks in the block -->
  <g stroke="#7a5cc4" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M112 236 q34 -6 66 0"/>
    <path d="M100 290 q30 5 58 -1"/>
    <path d="M360 236 q28 -5 52 1"/>
  </g>
  <!-- Crescent moon -->
  <circle cx="166" cy="158" r="64" fill="#e9e4f7" mask="url(#crescent)"/>
  <!-- Sitting wolf, snout to the sky: the Howl -->
  <path fill="#e9e4f7" d="M150 404
    C112 400 96 368 110 340 C118 324 136 318 146 330 C140 350 150 368 174 372
    C182 340 194 310 210 284 C222 262 236 244 246 228 C242 206 244 186 252 170
    L262 120 L280 150 L298 118 L304 156
    C318 150 332 140 344 130 L374 106 C382 108 384 118 378 124 L340 170
    C334 182 326 194 322 206 L332 222 L320 234 L334 250 L322 262
    C318 300 324 352 336 404 L304 404 L298 370 C292 388 284 398 276 404 Z"/>
  <!-- Ice-blue eye and the seat-colour collar -->
  <circle cx="300" cy="168" r="7" fill="#9fd3f2"/>
  <path d="M244 222 C262 232 292 232 320 214" stroke="#a58bd6" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- Ground line -->
  <path d="M120 406 L392 406" stroke="#e9e4f7" stroke-width="10" stroke-linecap="round"/>
</svg>
